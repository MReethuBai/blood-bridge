version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "80:80"
      - "5174:80"
    depends_on:
      - web
    restart: always

  web:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_URI=postgresql+asyncpg://postgres:postgres@db:5432/intellearn
      - REDIS_URI=redis://redis:6379/0
      - GEMINI_API_KEY=YOUR_GEMINI_API_KEY_HERE
    depends_on:
      - db
      - redis
    restart: always

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=intellearn
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: always

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=info
    environment:
      - REDIS_URI=redis://redis:6379/0
    depends_on:
      - redis
    restart: always

volumes:
  postgres_data:
