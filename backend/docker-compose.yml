version: '3.8'

services:
  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_URI=postgresql+asyncpg://intellearn:secretpassword@postgres:5432/intellearn_db
      - MONGO_URI=mongodb://mongo:27017
      - REDIS_URI=redis://redis:6379/0
    depends_on:
      - postgres
      - mongo
      - redis

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: intellearn
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: intellearn_db
    ports:
      - "5432:5432"

  mongo:
    image: mongo:6-jammy
    ports:
      - "27017:27017"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
